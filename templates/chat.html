{% extends "base.html" %}
{% block content %}

<style>
  .chat-wrap {
    max-width: 640px;
    margin: auto;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
    overflow: hidden;
  }
  .chat-head {
    background: #0d6efd;
    color: #fff;
    padding: 14px 20px;
  }
  .chat-box {
    height: 420px;
    overflow-y: auto;
    padding: 20px;
    background: #f8f9fa;
  }
  .message {
    margin-bottom: 14px;
  }
  .user {
    text-align: right;
  }
  .bot {
    text-align: left;
  }
  .bubble {
    display: inline-block;
    padding: 10px 15px;
    border-radius: 18px;
    max-width: 75%;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .user .bubble {
    background: #0d6efd;
    color: #fff;
  }
  .bot .bubble {
    background: #e9ecef;
    color: #212529;
  }
  .input-area {
    padding: 16px 20px;
    display: flex;
    gap: 10px;
    border-top: 1px solid #eee;
  }
  .input-area input {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid #ddd;
    border-radius: 20px;
  }
  .input-area button {
    padding: 10px 22px;
    border: none;
    border-radius: 20px;
    background: #0d6efd;
    color: #fff;
    cursor: pointer;
  }
</style>

<div class="chat-wrap">
  <div class="chat-head">
    <h5 class="mb-0">RAG 智能客服</h5>
    <small>命中知识库与数据库实时信息；高频问题直答，其余走检索增强。</small>
  </div>

  <div class="chat-box" id="chat-box">
    <div class="message bot">
      <div class="bubble">您好！我是智阅书店智能客服，有什么可以帮助您的？</div>
    </div>
  </div>

  <div class="input-area">
    <input
      type="text"
      id="query"
      placeholder="请输入您的问题，如：有哪些书 / 我购物车里有什么 / 多久能送到"
      onkeypress="handleKeyPress(event)"
      autocomplete="off"
    />
    <button onclick="ask()">发送</button>
  </div>
</div>

{% endblock %}

{% block scripts %}
<script>
  async function ask() {
    const input = document.getElementById("query");
    const q = input.value.trim();
    if (!q) return;
    addMessage("user", q);
    input.value = "";
    try {
      const resp = await fetch("/ask?q=" + encodeURIComponent(q), { credentials: "include" });
      const data = resp.ok && (resp.headers.get("content-type") || "").includes("application/json")
        ? await resp.json()
        : {};
      if (resp.status === 401) {
        showToast("请先登录后再使用客服聊天");
        setTimeout(() => (window.location.href = "/login?next=/chat"), 800);
        return;
      }
      if (!resp.ok) {
        throw new Error(data.detail || "请求失败");
      }
      addMessage("bot", data.answer || "抱歉，我无法回答这个问题");
    } catch (error) {
      addMessage("bot", "回答失败: " + (error.message || "未知错误"));
    }
  }

  // XSS 安全：用 textContent 写入文本，不解析 HTML；white-space:pre-wrap 保留换行。
  function addMessage(sender, text) {
    const chatBox = document.getElementById("chat-box");
    const messageDiv = document.createElement("div");
    messageDiv.className = "message " + sender;
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    messageDiv.appendChild(bubble);
    chatBox.appendChild(messageDiv);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function handleKeyPress(event) {
    if (event.key === "Enter") {
      ask();
    }
  }
</script>
{% endblock %}
