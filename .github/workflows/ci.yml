name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # 先装 CPU 版 torch，避免 pip 默认拉取 CUDA 巨型包
      - name: 安装 torch (CPU)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: 安装依赖
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff 格式检查
        run: ruff format --check .

      - name: 测试
        env:
          # CI 无模型缓存，向量加载失败会降级为 BM25；不影响检索测试断言
          HF_LOCAL_FILES_ONLY: "1"
          ENV: development
        run: pytest -q
